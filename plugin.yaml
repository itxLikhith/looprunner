name: looprunner
version: "0.8.0"
description: >-
  Set-and-forget autonomous QA loop runner for any repo: runs your verify command,
  diagnoses failures with the host LLM, fixes the source on a branch, opens a PR,
  and stops itself when it stalls or runs out of budget.
author: Likhith Sai
license: MIT
homepage: https://github.com/itxLikhith/looprunner
tags: [automation, kanban, loop, qa, autonomous, testing, ci]
requires_hermes: ">=0.22.0"
provides_tools:
  - loop_start
  - loop_tick
  - loop_verify
  - loop_status
  - loop_history
  - loop_analyze
  - loop_recommend
  - loop_commit
  - loop_revert
  - loop_pause
  - loop_resume
  - loop_stop
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - pre_tool_call
capabilities: []
config_schema:
  default_profile:
    type: str
    default: ""
    description: "Hermes profile to spawn workers in (empty = current)"
  max_rounds:
    type: int
    default: 10
    description: "Max PASSING rounds before auto-pause"
  max_attempts:
    type: int
    default: 20
    description: "Max total verify runs before the loop gives up"
  stall_threshold:
    type: int
    default: 3
    description: "Same failure signature repeats before the loop stalls itself"
  verify_cmd:
    type: str
    default: ""
    description: "Verification command to run each round (e.g. cargo test -p gateway)"
  auto_fix:
    type: bool
    default: false
    description: "Reserved for future auto-fix rounds"
  strict_git_guard:
    type: bool
    default: true
    description: "Block direct git commit/push while a loop is active on main/master"