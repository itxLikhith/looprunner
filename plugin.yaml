name: looprunner
version: "0.10.0"
description: >-
  Set-and-forget autonomous QA loop runner for any repo: runs your verify command,
  diagnoses failures with the host LLM, fixes the source on a branch, opens a PR,
  and stops itself when it stalls or runs out of budget. Can watch a repository's
  issues and dispatch goal-mode kanban cards, gate PRs on a security review, and
  checkpoint a stalled stage for a later retry.
author: Likhith Sai
license: MIT
homepage: https://github.com/itxLikhith/looprunner
tags: [automation, kanban, loop, qa, autonomous, testing, ci, security, issues]
requires_hermes: ">=0.22.0"
# Advisory inter-plugin dependency: load order honors this edge, and a missing
# dependency only logs a warning. The plugin probes at runtime with
# ctx.has_plugin("hermes-security") and falls back to its built-in LLM review.
requires_plugins:
  - id: hermes-security
provides_tools:
  - loop_start
  - loop_tick
  - loop_verify
  - loop_status
  - loop_history
  - loop_analyze
  - loop_commit
  - loop_revert
  - loop_watch
  - loop_scan_issues
  - loop_security
  - loop_security_card
  - loop_checkpoint
  - loop_recommend
  - loop_pause
  - loop_resume
  - loop_stop
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - pre_tool_call
capabilities: []
config_schema:
  default_profile:
    type: str
    default: ""
    description: "Hermes profile to spawn workers in (empty = current)"
  max_rounds:
    type: int
    default: 10
    description: "Max PASSING rounds before auto-pause"
  max_attempts:
    type: int
    default: 20
    description: "Max total verify runs before the loop gives up"
  stall_threshold:
    type: int
    default: 3
    description: "Same failure signature repeats before the loop stalls itself"
  goal_cmd:
    type: str
    default: ""
    description: "Acceptance command for the goal; the loop only completes when it exits 0"
  checkpoint_on_stall:
    type: bool
    default: true
    description: "Snapshot the stage, dispatch a resume card and schedule a retry cron on stall"
  security_gate:
    type: bool
    default: false
    description: "Security-review the diff before opening a PR; refuse on critical/high findings"
  verify_cmd:
    type: str
    default: ""
    description: "Verification command to run each round (e.g. cargo test -p gateway)"
  auto_fix:
    type: bool
    default: false
    description: "Reserved for future auto-fix rounds"
  strict_git_guard:
    type: bool
    default: true
    description: "Block direct git commit/push while a loop is active on main/master"
  assignee:
    type: str
    default: ""
    description: "Kanban profile to assign dispatched cards to"
  goal_max_turns:
    type: int
    default: 20
    description: "Turn budget for goal-mode kanban cards"